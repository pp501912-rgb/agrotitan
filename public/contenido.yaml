# ═══════════════════════════════════════════════════════════════════
#  1 · HERO
# ═══════════════════════════════════════════════════════════════════
hero:
  titulo: El poder detrás de cada cosecha.
  subtitulo: >-
    Evaluación técnica, económica y financiera de proyectos
    agropecuarios para inversores y productores que lideran el sector.
  cta_principal:
    texto: Ver Informes Titánicos
