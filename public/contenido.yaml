# ═══════════════════════════════════════════════════════════════════
#  2 · NUESTRO ENFOQUE
# ═══════════════════════════════════════════════════════════════════
enfoque:
  titulo: Nuestro Enfoque
  bajada: >-
    Un proyecto agropecuario no se evalúa desde una sola disciplina.
    La tierra responde a la agronomía; el capital, a los números.
    Nosotros trabajamos las dos al mismo tiempo.

  quienes_somos: >-
    Somos un equipo de ingenieros agrónomos y zootecnistas. Cada
    proyecto que evaluamos pasa por manos que conocen el cultivo y por
    manos que conocen el flujo de fondos. No tercerizamos el criterio
    técnico ni el análisis financiero: los sostenemos juntos.

  modelo_titulo: Proyecto llave en mano
  modelo: >-
    Entregamos el proyecto completo: relevamiento, análisis y
    documentación lista para presentar ante un banco, un socio o un
    directorio. A partir de ahí, el acompañamiento posterior se define
    con cada productor según lo que el proyecto necesite — no todos
    necesitan lo mismo, y no cobramos por lo que no hace falta.

  pilares:
    - id: tecnico
      titulo: Análisis Técnico
      texto: >-
        Aptitud del suelo, clima, agua, manejo y tecnología. Determina
        si el proyecto es posible antes de preguntarse si es rentable.
    - id: economico
      titulo: Análisis Económico
      texto: >-
        Costos de implantación y mantenimiento, márgenes brutos,
        productividad esperada por hectárea. Determina cuánto deja.
    - id: financiero
      titulo: Análisis Financiero
      texto: >-
        Flujo de fondos, período de repago, tasa interna de retorno y
        sensibilidad. Determina si conviene, y bajo qué supuestos deja
        de convenir.

# ═══════════════════════════════════════════════════════════════════
#  3 · COLUMNAS DEL COLOSO (servicios)
# ═══════════════════════════════════════════════════════════════════
servicios:
  titulo: Columnas del Coloso
  bajada: >-
    Cinco líneas de trabajo. Se contratan por separado o como parte de
    una evaluación integral.

  items:
    - id: factibilidad
      titulo: Factibilidad técnica, económica y financiera
      texto: >-
        El estudio completo de un proyecto antes de comprometer
        capital. Responde una sola pregunta con todo el rigor
        disponible: ¿esto se puede hacer, y conviene hacerlo?
      acento: oro

    - id: margenes
      titulo: Márgenes brutos y rentabilidad proyectada
      texto: >-
        Cuánto deja cada hectárea, cada lote y cada campaña.
        Proyectado a horizonte real de la inversión, no a un año
        aislado que puede ser bueno por casualidad.
      acento: verde

    - id: riesgo
      titulo: Impacto climático y de riesgo
      texto: >-
        Qué pasa con el proyecto si el año viene seco, si hay heladas
        tardías o si el precio se cae. Un proyecto que solo cierra en
        el escenario bueno no es un proyecto: es una apuesta.
      acento: oro

    - id: valuacion
      titulo: Valuación de campos y proyectos
      texto: >-
        Cuánto vale realmente un campo según lo que puede producir, no
        según lo que pide el mercado. Para comprar, para vender y para
        respaldar una operación.
      acento: verde

    - id: seguimiento
      titulo: Seguimiento y asesoramiento post-inversión
      texto: >-
        La evaluación no termina cuando se firma. Acompañamos la
        ejecución y contrastamos lo proyectado contra lo que
        efectivamente pasa — que es la única forma de que el próximo
        proyecto se evalúe mejor.
      acento: oro

# ═══════════════════════════════════════════════════════════════════
#  4 · PROYECTOS EJECUTADOS
# ═══════════════════════════════════════════════════════════════════
#  ⚠ SIN nombres de clientes, SIN superficies, SIN ubicaciones y SIN
#    números. Un caso de estudio puede identificar a un cliente por
#    combinación de datos aunque no diga el nombre.
# ═══════════════════════════════════════════════════════════════════
proyectos:
  titulo: Proyectos Ejecutados
  bajada: >-
    Trabajos realizados en frutales extensivos y producciones
    intensivas. Los detalles de cada caso se comparten en reunión, con
    el consentimiento del productor involucrado.

  aviso_confidencialidad: >-
    No publicamos nombres, superficies ni resultados de nuestros
    clientes. La información de un proyecto es del productor, no
    nuestra.

  items:
    - id: nogal
      rubro: Nogal
      tipo: Frutal extensivo
      texto: >-
        Evaluación de implantación con horizonte de largo plazo y
        análisis de los años improductivos iniciales.
      cta: Consultar caso completo

    - id: avellano
      rubro: Avellano
      tipo: Frutal extensivo
      texto: >-
        Estudio de aptitud y proyección de rendimiento en zona de
        expansión del cultivo.
      cta: Consultar caso completo

    - id: cerezo
      rubro: Cerezo
      tipo: Frutal extensivo
      texto: >-
        Análisis de ventana comercial y su impacto sobre el retorno
        del proyecto.
      cta: Consultar caso completo

    - id: arandano
      rubro: Arándano
      tipo: Frutal intensivo
      texto: >-
        Evaluación de inversión con estructura de costos de alta
        intensidad de mano de obra.
      cta: Consultar caso completo

    - id: avicola
      rubro: Avícola black-out
      tipo: Producción intensiva
      texto: >-
        Proyecto de galpones en sistema de ambiente controlado, con
        análisis de eficiencia de conversión y consumo energético.
      cta: Consultar caso completo

# ═══════════════════════════════════════════════════════════════════
#  5 · EL ARSENAL (fase 2)
# ═══════════════════════════════════════════════════════════════════
arsenal:
  titulo: El Arsenal
  estado: Próximamente
  bajada: >-
    Herramientas de cálculo abiertas para que puedas hacer tus propias
    estimaciones antes de llamarnos.

  proximas:
    - titulo: Calculadora de retorno
      texto: Retorno estimado de una inversión frutal según superficie y rubro.
    - titulo: Simulador de costos de implantación
      texto: Costo de puesta en marcha según insumos y densidad de plantación.
    - titulo: Análisis de sensibilidad
      texto: Cómo cambia el resultado si cambia el precio, el rinde o el clima.

  nota: >-
    Estas herramientas van a dar estimaciones orientativas, no
    evaluaciones. Un número calculado en dos minutos no reemplaza un
    estudio de factibilidad, y no vamos a presentarlo como si lo
    hiciera.

# ═══════════════════════════════════════════════════════════════════
#  6 · BLOG
# ═══════════════════════════════════════════════════════════════════
blog:
  titulo: Análisis y Recursos
  bajada: >-
    Publicamos análisis técnico y económico del sector. Sin
    especulación de mercado ni pronósticos de precios: no es lo que
    hacemos.

  categorias:
    - id: rentabilidad
      nombre: Rentabilidad por rubro
      descripcion: Números y márgenes por cultivo y por sistema productivo.
    - id: contexto
      nombre: Contexto de mercado
      descripcion: Hacia dónde se mueve la inversión en el sector, y por qué.
    - id: casos
      nombre: Casos de estudio
      descripcion: Proyectos reales, publicados con autorización.
    - id: guias
      nombre: Guías técnicas
      descripcion: Cómo se evalúa un proyecto, explicado en detalle.

  # ⚠ Todavía sin artículos. Cuando escribas el primero, se agrega acá
  #   y se crea su HTML a partir de articulo.html
  articulos: []

  vacio: >-
    Estamos preparando los primeros análisis. Si querés que te avise
    cuando publiquemos, escribinos.

# ═══════════════════════════════════════════════════════════════════
#  7 · CONTACTO
# ═══════════════════════════════════════════════════════════════════
contacto_seccion:
  titulo: Solicitar Evaluación
  bajada: >-
    Contanos qué proyecto tenés en mente. Te respondemos con una
    primera devolución sobre qué tipo de evaluación necesita.

  # ⚠ Este texto tiene que ser verdad. Contrastalo contra tus plazos
  #   reales en config/negocio.yaml antes de publicar.
  compromiso: >-
    Leemos todas las consultas. Te respondemos personalmente — no hay
    respuestas automáticas de nuestro lado.

  nota_privacidad: >-
    Tus datos van directo a nosotros por WhatsApp o correo. Este sitio
    no guarda información, no usa cookies y no tiene rastreadores de
    terceros.

  formulario:
    nombre:
      etiqueta: Nombre y apellido
      obligatorio: true
    pais:
      etiqueta: País
      obligatorio: true
      opciones: [Argentina, Chile, Uruguay, Paraguay, Otro]
    perfil:
      etiqueta: Sos
      obligatorio: true
      opciones:
        - Productor
        - Inversor
        - Institución financiera
        - Otro
    rubro:
      etiqueta: Rubro de interés
      obligatorio: false
      opciones:
        - Frutales extensivos (nogal, avellano, cerezo)
        - Frutales intensivos (arándano y otros)
        - Producción avícola
        - Ganadería
        - Agricultura extensiva
        - Todavía no lo defino
        - Otro
    mensaje:
      etiqueta: Contanos del proyecto
      obligatorio: true
      ayuda: >-
        Superficie aproximada, zona, en qué etapa está y qué necesitás
        resolver.

  boton_whatsapp: Enviar por WhatsApp
  boton_email: Enviar por correo

