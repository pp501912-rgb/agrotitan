  perfil se puede analizar, pero su calibración hay que declararla aparte.
bandas:
  - {orden: 1, rol: green,   lambda_nm: 560, fwhm_nm: 20}
  - {orden: 2, rol: red,     lambda_nm: 660, fwhm_nm: 20}
  - {orden: 3, rol: rededge, lambda_nm: 730, fwhm_nm: 15}
  - {orden: 4, rol: nir,     lambda_nm: 840, fwhm_nm: 40}
