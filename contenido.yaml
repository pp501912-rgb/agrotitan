# ── Restricciones autoimpuestas ────────────────────────────────
# Las tres son deliberadas y condicionan todo lo que se puede hacer
# en marketing. No son limitaciones a corregir: son definiciones.
restricciones:
  confidencialidad: >-
    No se publican nombres de clientes, superficies, ubicaciones ni resultados.
    La información de un proyecto le pertenece al productor. Publicamos el
    método, no el cliente. Los casos publicados están construidos a modo de
    ejemplo y el sitio lo aclara.
  sin_nombres_propios: >-
    Sólo credenciales colectivas del equipo. Decisión del propietario.
  sin_rastreo: >-
    Sin cookies, sin analítica de terceros y sin guardar información del
    visitante. Las tipografías se sirven desde el propio sitio para que ningún
    tercero vea su IP. El formulario no manda nada a ningún servidor: arma el
    mensaje y lo abre en WhatsApp o en el correo del visitante.
    Costo práctico a tener presente: sin ninguna medición, no hay forma de
    saber si un cambio en la página funcionó.

# ── Aviso legal ────────────────────────────────────────────────
descargo: >-
  Los análisis publicados en este sitio son de carácter orientativo y no
  constituyen recomendación de inversión. Cada proyecto requiere un estudio
  particular. AgroTitan no garantiza resultados productivos ni financieros.
